
services:
  database_postgres:
    image: postgres:latest
    container_name: database_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: emaricar_developer
      POSTGRES_PASSWORD: emaricar16
      POSTGRES_DB: db_mulembe_app
    volumes:
      - ./docker/postgresql/data:/var/lib/postgresql/data
    networks:
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emaricar_developer -d db_mulembe_app"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  backend_ecommerce_core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_ecommerce
    restart: unless-stopped
    ports:
        - "3000:3000"
    environment:
        .env_file: .env
    volumes:
        - ./:/app
        - /app/node_modules
    depends_on:
      database_postgres:
        condition: service_healthy
    networks:
      - private_network
      - public_network

networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge
