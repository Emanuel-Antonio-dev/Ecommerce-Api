name: CI Pipeline
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
  steps:
    - name: Clonar o código
    - uses: actions/checkout@v4
      
      -name: Instalar o Node
      -uses: actions/setup-node@v4
      
      with:
        node-version: "22"
      
      -name: Instalar as dependências
      run: npm install
    
      -name: Executar os testes
      run: npm run test