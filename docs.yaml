  # ── SYSTEM LOGS ───────────────────────────────────────────────────────────
  /system-logs:
    get:
      tags: [SystemLogs]
      summary: Listar todos os logs (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: ip_address
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Lista de logs com paginação }

  /system-logs/me:
    get:
      tags: [SystemLogs]
      summary: Logs do utilizador autenticado
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: Logs da própria conta }

  /system-logs/account/{id_account}:
    get:
      tags: [SystemLogs]
      summary: Logs de uma conta específica (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_account
          required: true
          schema: { type: string }
      responses:
        '200': { description: Logs da conta }
    delete:
      tags: [SystemLogs]
      summary: Eliminar logs de uma conta — GDPR (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_account
          required: true
          schema: { type: string }
      responses:
        '200': { description: Logs da conta eliminados }

  /system-logs/purge:
    delete:
      tags: [SystemLogs]
      summary: Purge de logs por retenção — mínimo 7 dias (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: days
          required: true
          schema: { type: integer, minimum: 7 }
      responses:
        '200': { description: Logs eliminados com contagem }
        '400': { description: Retenção mínima não respeitada }

  /system-logs/all:
    delete:
      tags: [SystemLogs]
      summary: Eliminar todos os logs — operação nuclear (Admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Todos os logs eliminados }