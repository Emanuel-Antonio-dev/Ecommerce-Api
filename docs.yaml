      responses:
        '200': { description: Dados SEO }
        '404': { description: Não encontrado }
    patch:
      tags: [SEO]
      summary: Actualizar settings SEO (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_seo_setting
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seo_title: { type: string }
                seo_description: { type: string }
                canonical_url: { type: string }
                og_title: { type: string }
                og_description: { type: string }
                og_image: { type: string }
      responses:
        '200': { description: SEO actualizado }

  # ── ADMIN ─────────────────────────────────────────────────────────────────
  /admins/users:
    get:
      tags: [Admin]
