openapi: 3.0.3
info:
  title: E-Commerce API
  description: API REST para plataforma de e-commerce com produtos, carrinho, pedidos, pagamentos Stripe, envios, cupões, wishlist e logs de sistema.
  version: 1.0.0
  contact:
    name: API Support
    email: support@yourstore.com

servers:
  - url: http://localhost:3000/api.ecommerce/v1
    description: Desenvolvimento local
  - url: https://api.yourstore.com/api.ecommerce/v1
    description: Produção

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Products
  - name: Categories
  - name: Brands
  - name: Tags
  - name: Variants
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Shipments
  - name: Coupons
  - name: Wishlist
  - name: Reviews
  - name: SEO
  - name: Admin
  - name: SystemLogs

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string }
        datas: { type: object }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer }
        message: { type: string }

    PaginationMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        total_pages: { type: integer }

    Product:
      type: object
      properties:
        id_product: { type: integer }
        reference_code: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        additional_info: { type: string }
        price: { type: number }
        weight: { type: number }
        available: { type: boolean }
        is_featured: { type: boolean }
        views_count: { type: integer }
        sales_count: { type: integer }
        created_at: { type: string, format: date-time }

    ProductVariant:
      type: object
      properties:
        id_variant: { type: integer }
        sku: { type: string }
        color: { type: string }
        size: { type: string }
        stock: { type: integer }
        low_stock_alert: { type: integer }
        price: { type: number }

    Shipment:
      type: object
      properties:
        id_shipment: { type: string }
        tracking_code: { type: string }
        carrier: { type: string }
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        estimated_delivery: { type: string, format: date-time }
        shipped_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }

    Coupon:
      type: object
      properties:
        id_coupon: { type: string }
        code: { type: string }
        description: { type: string }
        discount_type:
          type: string
          enum: [percentage, fixed]
        discount_value: { type: number }
        minimum_amount: { type: number }
        usage_limit: { type: integer }
        used_count: { type: integer }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        active: { type: boolean }

    Order:
      type: object
      properties:
        id_order: { type: integer }
        order_number: { type: string }
        total_amount: { type: number }
        discount_amount: { type: number }
        status:
          type: string
          enum: [pending, completed, cancelled, failed]
        payment_method:
          type: string
          enum: [cash, card, transfer, paypal, stripe]

paths:

  # ── HEALTH ────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Servidor operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: OK }
                  timestamp: { type: string, format: date-time }
                  uptime: { type: number }
                  environment: { type: string }

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/me:
    get:
      tags: [Auth]
      summary: Obter dados do utilizador autenticado (do token)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Dados do utilizador actual }
        '401': { description: Não autorizado }

  /auth/signup:
    post:
      tags: [Auth]
      summary: Registar novo utilizador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password]
              properties:
                first_name: { type: string, example: Paulo }
                last_name: { type: string, example: Joaquim }
                email: { type: string, format: email, example: user@example.com }
                password: { type: string, example: "Secure16@" }
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      phone_number: { type: string, example: "944395940" }
                addresses:
                  type: array
                  items:
                    type: object
                    properties:
                      city: { type: string, example: Luanda }
                      street: { type: string, example: "Rua 30 24" }
      responses:
        '201': { description: Conta criada com sucesso }
        '409': { description: Email já registado }
        '400': { description: Dados inválidos }

  /auth/signin:
    post:
      tags: [Auth]
      summary: Login com email e password
      description: Rate limited — bloqueio após tentativas excessivas por 2 minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                id_guest_cart:
                  type: string
                  description: UUID do carrinho guest para migração após login
                  example: "41216da5-07db-4558-a111-373377bd49c8"
      responses:
        '200':
          description: Login bem sucedido — access token no body, refreshToken em cookie httpOnly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  accessToken: { type: string }
        '401': { description: Credenciais inválidas }
        '403': { description: Conta suspensa ou não verificada }
        '429': { description: Rate limit excedido }

  /auth/refreshToken:
    post:
      tags: [Auth]
      summary: Renovar access token via cookie httpOnly refreshToken
      responses:
        '200':
          description: Novo access token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        '401': { description: Refresh token inválido ou expirado }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout — invalida refresh token no servidor
      responses:
        '200': { description: Sessão terminada }

  /auth/password/request:
    post:
      tags: [Auth]
      summary: Solicitar reset de password por email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Email de reset enviado }
        '404': { description: Conta não encontrada }

  /auth/password/reset:
    put:
      tags: [Auth]
      summary: Definir nova password via token de reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string }
      responses:
        '200': { description: Password actualizada }
        '400': { description: Token inválido ou expirado }

  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Enviar código OTP para 2FA
      responses:
        '200': { description: Código enviado }

  /auth/otp/verify-code:
    post:
      tags: [Auth]
      summary: Validar código OTP (2FA)
      description: Rate limited — máximo 3 tentativas antes de bloqueio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_code]
              properties:
                otp_code: { type: string, example: "123456" }
      responses:
        '200': { description: OTP válido }
        '400': { description: Código inválido }
        '429': { description: Tentativas excedidas }

  /auth/google/signin:
    get:
      tags: [Auth]
      summary: Iniciar autenticação OAuth Google
      responses:
        '302': { description: Redireccionamento para Google }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth Google
      responses:
        '302': { description: Redireccionamento para frontend com token }

  /auth/facebook/signin:
    get:
      tags: [Auth]
      summary: Iniciar autenticação OAuth Facebook
      responses:
        '302': { description: Redireccionamento para Facebook }

  /auth/facebook/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth Facebook
      responses:
        '302': { description: Redireccionamento para frontend com token }

  # ── USERS ─────────────────────────────────────────────────────────────────
  /users/{id_user}:
    get:
      tags: [Users]
      summary: Obter perfil de utilizador
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_user
          required: true
          schema: { type: string }
      responses:
        '200': { description: Dados do perfil }
        '404': { description: Utilizador não encontrado }
    patch:
      tags: [Users]
      summary: Editar perfil de utilizador
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_user
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                username: { type: string }
      responses:
        '200': { description: Perfil actualizado }
        '400': { description: Dados inválidos }
    delete:
      tags: [Users]
      summary: Eliminar conta de utilizador (soft delete)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_user
          required: true
          schema: { type: string }
      responses:
        '200': { description: Conta eliminada }
        '404': { description: Utilizador não encontrado }

  # ── PRODUCTS ──────────────────────────────────────────────────────────────
  /products:
    get:
      tags: [Products]
      summary: Listar todos os produtos (paginado)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: Lista de produtos }
    post:
      tags: [Products]
      summary: Criar produto (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, additional_info, price, weight, id_category_fk, id_brand_fk]
              properties:
                name: { type: string }
                description: { type: string }
                additional_info: { type: string }
                price: { type: number }
                weight: { type: number }
                id_category_fk: { type: integer }
                id_brand_fk: { type: integer }
                id_tags: { type: string, description: "IDs separados por vírgula" }
                is_featured: { type: boolean }
                color: { type: string }
                size: { type: string }
                stock: { type: integer }
                ProductImages:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201': { description: Produto criado }
        '409': { description: Produto já existe }

  /products/{id_product}:
    get:
      tags: [Products]
      summary: Obter produto por id (incrementa views_count)
      parameters:
        - in: path
          name: id_product
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Dados completos do produto }
        '404': { description: Produto não encontrado }
    patch:
      tags: [Products]
      summary: Editar produto (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_product
          required: true
          schema: { type: integer }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: number }
                available: { type: boolean }
                is_featured: { type: boolean }
                weight: { type: number }
                ProductImages:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200': { description: Produto actualizado }
    delete:
      tags: [Products]
      summary: Eliminar produto (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_product
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Produto eliminado }

  /products/reviews:
    post:
      tags: [Reviews]
      summary: Registar avaliação de produto (Cliente autenticado)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_product_fk, rating]
              properties:
                id_product_fk: { type: integer }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
                id_order_item_fk: { type: integer }
      responses:
        '201': { description: Review registada }
        '409': { description: Já avaliou este produto }

  /products/{id_product_fk}/reviews:
    get:
      tags: [Reviews]
      summary: Listar avaliações de um produto
      parameters:
        - in: path
          name: id_product_fk
          required: true
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: Lista de avaliações com média }

  # ── CATEGORIES ────────────────────────────────────────────────────────────
  /products/categories:
    get:
      tags: [Categories]
      summary: Listar todas as categorias
      responses:
        '200': { description: Lista de categorias }
    post:
      tags: [Categories]
      summary: Criar categoria (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201': { description: Categoria criada }
        '409': { description: Categoria já existe }
    delete:
      tags: [Categories]
      summary: Eliminar todas as categorias (Admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Todas as categorias eliminadas }

  /products/categories/{id_category}:
    get:
      tags: [Categories]
      summary: Obter categoria por id
      parameters:
        - in: path
          name: id_category
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Dados da categoria }
        '404': { description: Categoria não encontrada }
    patch:
      tags: [Categories]
      summary: Editar categoria (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_category
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Categoria actualizada }
    delete:
      tags: [Categories]
      summary: Eliminar categoria (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_category
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Categoria eliminada }

  # ── BRANDS ────────────────────────────────────────────────────────────────
  /brands:
    get:
      tags: [Brands]
      summary: Listar todas as marcas
      responses:
        '200': { description: Lista de marcas }
    post:
      tags: [Brands]
      summary: Criar marca (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: Marca criada }
    delete:
      tags: [Brands]
      summary: Eliminar todas as marcas (Admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Marcas eliminadas }

  /brands/{id_brand}:
    get:
      tags: [Brands]
      summary: Obter marca por nome
      description: O parâmetro aceita o nome da marca conforme as rotas reais.
      parameters:
        - in: path
          name: id_brand
          required: true
          schema: { type: string }
          description: Nome ou id da marca
      responses:
        '200': { description: Dados da marca }
        '404': { description: Marca não encontrada }
    put:
      tags: [Brands]
      summary: Editar marca (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_brand
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200': { description: Marca actualizada }
    delete:
      tags: [Brands]
      summary: Eliminar marca (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_brand
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Marca eliminada }

  # ── TAGS ──────────────────────────────────────────────────────────────────
  /tags:
    get:
      tags: [Tags]
      summary: Listar todas as tags
      responses:
        '200': { description: Lista de tags }
    post:
      tags: [Tags]
      summary: Criar tag (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: { type: string }
      responses:
        '201': { description: Tag criada }

  /tags/{id_tag}:
    get:
      tags: [Tags]
      summary: Obter tag por nome
      parameters:
        - in: path
          name: id_tag
          required: true
          schema: { type: string }
          description: Nome ou id da tag
      responses:
        '200': { description: Dados da tag }
    delete:
      tags: [Tags]
      summary: Eliminar tag (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_tag
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Tag eliminada }

  # ── VARIANTS ──────────────────────────────────────────────────────────────
  /products/variants:
    post:
      tags: [Variants]
      summary: Criar variante de produto (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_product_fk, sku, price]
              properties:
                id_product_fk: { type: integer }
                sku: { type: string }
                color: { type: string }
                size: { type: string }
                stock: { type: integer }
                price: { type: number }
      responses:
        '201': { description: Variante criada }

  /products/variants/{id_product}/product:
    get:
      tags: [Variants]
      summary: Listar variantes de um produto
      parameters:
        - in: path
          name: id_product
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Lista de variantes }
        '404': { description: Produto não encontrado }

  /products/variants/{id_variant}:
    get:
      tags: [Variants]
      summary: Obter variante por id
      parameters:
        - in: path
          name: id_variant
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Dados da variante }
        '404': { description: Variante não encontrada }

  /products/variants/{id_variant}/stock:
    patch:
      tags: [Variants]
      summary: Actualizar stock de variante (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_variant
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock]
              properties:
                stock: { type: integer, minimum: 0 }
      responses:
        '200': { description: Stock actualizado }

  # ── CART ──────────────────────────────────────────────────────────────────
  /carts/guest:
    post:
      tags: [Cart]
      summary: Criar/adicionar ao carrinho guest (sem autenticação)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_guest_cart:
                  type: string
                  description: UUID do carrinho guest (omitir para criar novo)
                  example: "41216da5-07db-4558-a111-373377bd49c8"
                cartItems:
                  type: array
                  items:
                    type: object
                    required: [id_variant_fk, quantity, price]
                    properties:
                      id_variant_fk: { type: integer }
                      quantity: { type: integer }
                      price: { type: number }
      responses:
        '201': { description: Carrinho guest criado/actualizado }
        '400': { description: Stock insuficiente }

  /carts:
    post:
      tags: [Cart]
      summary: Criar/adicionar ao carrinho (utilizador autenticado)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cartItems:
                  type: array
                  items:
                    type: object
                    required: [id_variant_fk, quantity, price]
                    properties:
                      id_variant_fk: { type: integer }
                      quantity: { type: integer }
                      price: { type: number }
      responses:
        '201': { description: Carrinho criado/actualizado }
        '400': { description: Stock insuficiente }

  /carts/{id_user_fk}:
    get:
      tags: [Cart]
      summary: Obter carrinho de um utilizador
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_user_fk
          required: true
          schema: { type: string }
      responses:
        '200': { description: Itens do carrinho }
        '404': { description: Carrinho não encontrado }

  /carts/items/{id_user_fk}:
    delete:
      tags: [Cart]
      summary: Remover item específico do carrinho
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_user_fk
          required: true
          schema: { type: string }
      responses:
        '200': { description: Item removido }

  /carts/{id_cart}/items:
    delete:
      tags: [Cart]
      summary: Limpar todos os items do carrinho
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_cart
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Carrinho limpo }

  /carts/items/{id_cart_item}:
    put:
      tags: [Cart]
      summary: Actualizar quantidade de item no carrinho
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_cart_item
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200': { description: Item actualizado }

  # ── ORDERS ────────────────────────────────────────────────────────────────
  /orders:
    post:
      tags: [Orders]
      summary: Criar pedido a partir do carrinho (Cliente)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method, shipping_street, shipping_city, shipping_province, shipping_country]
              properties:
                payment_method:
                  type: string
                  enum: [cash, card, transfer, paypal, stripe]
                shipping_street: { type: string }
                shipping_city: { type: string }
                shipping_province: { type: string }
                shipping_country: { type: string, default: Angola }
                shipping_phone_number: { type: string }
      responses:
        '201': { description: Pedido criado }
        '400': { description: Carrinho vazio ou stock insuficiente }

  /orders/{id_order}/status:
    put:
      tags: [Orders]
      summary: Actualizar status do pedido (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_order
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, id_user]
              properties:
                status:
                  type: string
                  enum: [completed, cancelled, failed]
                id_user: { type: string }
      responses:
        '200': { description: Status actualizado }
        '400': { description: Transição inválida }
        '404': { description: Pedido não encontrado }

  # ── PAYMENTS ──────────────────────────────────────────────────────────────
  /payments/intent:
    post:
      tags: [Payments]
      summary: Criar Stripe Payment Intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_order]
              properties:
                id_order: { type: integer }
                currency: { type: string, default: aoa }
      responses:
        '200':
          description: Payment Intent criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  payment_id: { type: string }
        '404': { description: Pedido não encontrado }

  /payments/stripe/webhook:
    post:
      tags: [Payments]
      summary: Webhook Stripe (uso interno do Stripe)
      description: |
        Valida assinatura HMAC via `stripe-signature` header.
        Eventos tratados: payment_intent.succeeded, payment_intent.payment_failed, payment_intent.canceled.
        Em succeeded: marca payment paid, order completed, incrementa sales_count, devolve stock em failed/canceled.
      responses:
        '200': { description: Webhook processado }
        '400': { description: Assinatura inválida }

  # ── SHIPMENTS ─────────────────────────────────────────────────────────────
  /shipments:
    get:
      tags: [Shipments]
      summary: Listar todos os envios (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: Lista de envios }
    post:
      tags: [Shipments]
      summary: Registar envio (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_code, id_order_fk, status]
              properties:
                tracking_code: { type: string, description: "Formato: A-Z, 0-9, hífen. 4–40 chars." }
                carrier: { type: string, maxLength: 100 }
                id_order_fk: { type: integer }
                status:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled]
                estimated_delivery: { type: string, format: date-time, description: "Deve ser futura" }
                shipped_at: { type: string, format: date-time, description: "Não pode ser futura" }
                delivered_at: { type: string, format: date-time, description: "Não pode ser anterior a shipped_at" }
      responses:
        '201': { description: Envio registado }
        '400': { description: Dados inválidos ou pedido não pago }

  /shipments/find:
    get:
      tags: [Shipments]
      summary: Buscar envio por id ou tracking code
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: id
          schema: { type: string }
        - in: query
          name: code
          schema: { type: string }
      responses:
        '200': { description: Dados do envio }
        '404': { description: Envio não encontrado }

  /shipments/order/{id_order}:
    get:
      tags: [Shipments]
      summary: Buscar envio pelo id do pedido
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_order
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Dados do envio }
        '404': { description: Envio não encontrado }

  /shipments/{id_shipment}/status:
    patch:
      tags: [Shipments]
      summary: Actualizar status do envio com máquina de estados (Admin)
      description: |
        Transições permitidas:
        pending → processing, cancelled
        processing → shipped, cancelled
        shipped → delivered, cancelled
        delivered e cancelled são estados finais.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_shipment
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [processing, shipped, delivered, cancelled]
      responses:
        '200': { description: Status actualizado }
        '400': { description: Transição de estado inválida }
        '404': { description: Envio não encontrado }

  # ── COUPONS ───────────────────────────────────────────────────────────────
  /coupons:
    get:
      tags: [Coupons]
      summary: Listar todos os cupões (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: Lista de cupões }
    post:
      tags: [Coupons]
      summary: Criar cupão (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, discount_type, discount_value]
              properties:
                code: { type: string, description: "Formato: A-Z, 0-9, hífen, underscore. 3–30 chars." }
                description: { type: string }
                discount_type:
                  type: string
                  enum: [percentage, fixed]
                discount_value: { type: number, description: "Max 100 para percentage" }
                minimum_amount: { type: number }
                usage_limit: { type: integer }
                starts_at: { type: string, format: date-time }
                expires_at: { type: string, format: date-time, description: "Deve ser futura e posterior a starts_at" }
      responses:
        '201': { description: Cupão criado }
        '409': { description: Código já existe }

  /coupons/find:
    get:
      tags: [Coupons]
      summary: Buscar cupão por código (Autenticado)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: Dados do cupão }
        '404': { description: Cupão não encontrado }

  /coupons/apply:
    post:
      tags: [Coupons]
      summary: Aplicar cupão a um pedido (Autenticado)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, id_order_fk, order_total]
              properties:
                code: { type: string }
                id_order_fk: { type: integer }
                order_total: { type: number }
      responses:
        '200': { description: Cupão aplicado — devolve discount_applied }
        '400': { description: Cupão inválido, expirado, limite atingido ou já usado pelo utilizador }

  /coupons/{id_coupon}:
    get:
      tags: [Coupons]
      summary: Obter cupão por id (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_coupon
          required: true
          schema: { type: string }
      responses:
        '200': { description: Dados do cupão }
        '404': { description: Cupão não encontrado }
    patch:
      tags: [Coupons]
      summary: Editar cupão (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_coupon
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coupon'
      responses:
        '200': { description: Cupão actualizado }
    delete:
      tags: [Coupons]
      summary: Eliminar cupão — soft delete (Admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_coupon
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cupão removido }

  # ── WISHLIST ──────────────────────────────────────────────────────────────
  /wishlist:
    get:
      tags: [Wishlist]
      summary: Obter wishlist do utilizador autenticado
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: Wishlist paginada }
    post:
      tags: [Wishlist]
      summary: Adicionar produto à wishlist (máx 100 itens)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_product_fk]
              properties:
                id_product_fk: { type: integer }
      responses:
        '201': { description: Produto adicionado }
        '409': { description: Produto já está na wishlist }
        '400': { description: Limite de 100 itens atingido ou produto indisponível }

  /wishlist/clear:
    delete:
      tags: [Wishlist]
      summary: Limpar wishlist inteira
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Wishlist limpa }

  /wishlist/{id_product_fk}:
    delete:
      tags: [Wishlist]
      summary: Remover produto específico da wishlist
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id_product_fk
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Produto removido }
        '404': { description: Produto não está na wishlist }

  # ── SEO ───────────────────────────────────────────────────────────────────
  /settings/seo:
