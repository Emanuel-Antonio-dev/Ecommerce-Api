openapi: 3.0.3
info:
  title: Ecommerce API
  version: 1.0.0
  description: API de E-commerce com autenticação JWT, gestão de produtos, marcas, categorias e SEO.

servers:
  - url: http://localhost:3000/api.ecommerce/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    SignupDTO:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - username
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        provider:
          type: string
          example: Local
        password:
          type: string
        username:
          type: string

    SigninDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    TagDTO:
      type: object
      properties:
        tags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string

    CategoryDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    BrandDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    ProductDTO:
      type: object
      required:
        - name
        - price
        - id_category_fk
        - id_brand_fk
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        id_category_fk:
          type: integer
        id_brand_fk:
          type: integer
        available_stock:
          type: integer
        id_tags:
          type: string
          example: "1,2,3"
        additional_info:
          type: string
        is_featured:
          type: boolean
        weight:
          type: number

    SeoDTO:
      type: object
      properties:
        seo_title:
          type: string
        seo_description:
          type: string
        canonical_url:
          type: string
        og_title:
          type: string
        og_description:
          type: string
        og_image:
          type: string
        keywords:
          type: array
          items:
            type: string

paths:

  # =========================
  # AUTH
  # =========================

  /auth/signup:
    post:
      tags: [Auth]
      summary: Criar conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupDTO'
      responses:
        201:
          description: Conta criada com sucesso

  /auth/signin:
    post:
      tags: [Auth]
      summary: Login local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninDTO'
      responses:
        200:
          description: Login efetuado

  /auth/refreshToken:
    post:
      tags: [Auth]
      summary: Gerar novo access token
      responses:
        200:
          description: Token renovado

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        200:
          description: Logout efetuado

  /auth/password/request:
    post:
      tags: [Auth]
      summary: Solicitar redefinição de senha
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        200:
          description: Email enviado

  /auth/password/reset:
    put:
      tags: [Auth]
      summary: Resetar senha
      parameters:
        - in: query
          name: authorization
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
      responses:
        200:
          description: Senha redefinida

  # =========================
  # TAGS
  # =========================

  /tags:
    post:
      tags: [Tags]
      security:
        - bearerAuth: []
      summary: Registrar tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagDTO'
      responses:
        201:
          description: Tags criadas

    get:
      tags: [Tags]
      security:
        - bearerAuth: []
      summary: Listar tags
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        200:
          description: Lista de tags

  /tags/{slug}:
    get:
      tags: [Tags]
      summary: Buscar tag por slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        200:
          description: Tag encontrada

  # =========================
  # CATEGORIES
  # =========================

  /products/categories:
    post:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Criar categoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDTO'
      responses:
        201:
          description: Categoria criada

    get:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Listar categorias
      responses:
        200:
          description: Lista de categorias

  /products/categories/{id}:
    get:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Buscar categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Categoria encontrada

    patch:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Atualizar categoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDTO'
      responses:
        200:
          description: Categoria atualizada

    delete:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Remover categoria
      responses:
        200:
          description: Categoria removida

  # =========================
  # BRANDS
  # =========================

  /brands:
    post:
      tags: [Brands]
      security:
        - bearerAuth: []
      summary: Criar marca
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandDTO'
      responses:
        201:
          description: Marca criada

    get:
      tags: [Brands]
      security:
        - bearerAuth: []
      summary: Listar marcas
      responses:
        200:
          description: Lista de marcas

  /brands/{id}:
    get:
      tags: [Brands]
      security:
        - bearerAuth: []
      summary: Buscar marca
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Marca encontrada

    put:
      tags: [Brands]
      security:
        - bearerAuth: []
      summary: Atualizar marca
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandDTO'
      responses:
        200:
          description: Marca atualizada

    delete:
      tags: [Brands]
      security:
        - bearerAuth: []
      summary: Remover marca
      responses:
        200:
          description: Marca removida

  # =========================
  # PRODUCTS
  # =========================

  /products:
    post:
      tags: [Products]
      security:
        - bearerAuth: []
      summary: Criar produto
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                id_category_fk:
                  type: integer
                id_brand_fk:
                  type: integer
                available_stock:
                  type: integer
                id_tags:
                  type: string
                additional_info:
                  type: string
                is_featured:
                  type: boolean
                weight:
                  type: number
                ProductImages:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        201:
          description: Produto criado

    get:
      tags: [Products]
      security:
        - bearerAuth: []
      summary: Listar produtos
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        200:
          description: Lista de produtos

  /products/{id}:
    get:
      tags: [Products]
      security:
        - bearerAuth: []
      summary: Buscar produto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Produto encontrado

    patch:
      tags: [Products]
      security:
        - bearerAuth: []
      summary: Atualizar produto
      responses:
        200:
          description: Produto atualizado

    delete:
      tags: [Products]
      security:
        - bearerAuth: []
      summary: Remover produto
      responses:
        200:
          description: Produto removido

  # =========================
  # SETTINGS
  # =========================

  /settings/seo:
    post:
      tags: [Settings]
      summary: Inicializar configurações SEO
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeoDTO'
      responses:
        201:
          description: SEO configurado

    get:
      tags: [Settings]
      summary: Buscar configurações SEO
      responses:
        200:
          description: Dados SEO
