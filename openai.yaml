openapi: 3.0.3
info:
  title: Ecommerce API
  description: Documentação oficial da API Ecommerce
  version: 1.0.0

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Auth
  - name: Tags
  - name: Categories
  - name: Brands
  - name: Products

paths:

  /api.ecommerce/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Criar conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, username]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                provider:
                  type: string
                  example: Local
                password:
                  type: string
                  format: password
                username:
                  type: string
      responses:
        201:
          description: Usuário criado

  /api.ecommerce/v1/auth/signin:
    post:
      tags: [Auth]
      summary: Login local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login efetuado

  /api.ecommerce/v1/auth/refreshToken:
    post:
      tags: [Auth]
      summary: Renovar token
      responses:
        200:
          description: Token renovado

  /api.ecommerce/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        204:
          description: Logout efetuado

  /api.ecommerce/v1/auth/me:
    get:
      tags: [Auth]
      summary: Obter usuário logado
      security:
        - bearerAuth: []
      responses:
        200:
          description: Usuário autenticado

  /api.ecommerce/v1/auth/password/request:
    post:
      tags: [Auth]
      summary: Solicitar reset de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        200:
          description: Email enviado

  /api.ecommerce/v1/auth/password/reset:
    put:
      tags: [Auth]
      summary: Resetar senha
      parameters:
        - in: query
          name: authorization
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
      responses:
        200:
          description: Senha redefinida

  /api.ecommerce/v1/auth/otp/send:
    post:
      tags: [Auth]
      summary: Enviar código OTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        200:
          description: OTP enviado

  /api.ecommerce/v1/auth/otp/verify-code:
    post:
      tags: [Auth]
      summary: Verificar código OTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp_code]
              properties:
                email:
                  type: string
                otp_code:
                  type: string
      responses:
        200:
          description: OTP verificado

  /api.ecommerce/v1/tags:
    post:
      tags: [Tags]
      summary: Criar tags
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      tag:
                        type: string
      responses:
        201:
          description: Tags criadas
    get:
      tags: [Tags]
      summary: Listar tags
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        200:
          description: Lista de tags

  /api.ecommerce/v1/tags/{slug}:
    get:
      tags: [Tags]
      summary: Buscar tag por slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        200:
          description: Tag encontrada

  /api.ecommerce/v1/products/categories:
    post:
      tags: [Categories]
      summary: Criar categoria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        201:
          description: Categoria criada
    get:
      tags: [Categories]
      summary: Listar categorias
      responses:
        200:
          description: Lista de categorias

  /api.ecommerce/v1/products/categories/{id}:
    get:
      tags: [Categories]
      summary: Buscar categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Categoria encontrada
    patch:
      tags: [Categories]
      summary: Editar categoria
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        200:
          description: Categoria atualizada
    delete:
      tags: [Categories]
      summary: Deletar categoria
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Categoria removida

  /api.ecommerce/v1/brands:
    post:
      tags: [Brands]
      summary: Criar marca
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        201:
          description: Marca criada
    get:
      tags: [Brands]
      summary: Listar marcas
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        200:
          description: Lista de marcas

  /api.ecommerce/v1/brands/{idOrSlug}:
    get:
      tags: [Brands]
      summary: Buscar marca
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
      responses:
        200:
          description: Marca encontrada
    put:
      tags: [Brands]
      summary: Editar marca
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        200:
          description: Marca atualizada
    delete:
      tags: [Brands]
      summary: Deletar marca
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
      responses:
        204:
          description: Marca removida

  /api.ecommerce/v1/products:
    post:
      tags: [Products]
      summary: Criar produto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                id_category_fk:
                  type: integer
                id_brand_fk:
                  type: integer
                available_stock:
                  type: integer
                id_tags:
                  type: string
                  example: "1,2,3"
                ProductImages:
                  type: array
                  items:
                    type: string
                    format: binary
                additional_info:
                  type: string
                is_featured:
                  type: boolean
                weight:
                  type: number
      responses:
        201:
          description: Produto criado

    get:
      tags: [Products]
      summary: Listar produtos
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        200:
          description: Lista de produtos

  /api.ecommerce/v1/products/{id}:
    get:
      tags: [Products]
      summary: Buscar produto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Produto encontrado

    patch:
      tags: [Products]
      summary: Editar produto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        200:
          description: Produto atualizado

    delete:
      tags: [Products]
      summary: Deletar produto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Produto removido
